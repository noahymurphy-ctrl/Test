# Optional: regenerate Cadence.xcodeproj with XcodeGen (`brew install xcodegen && xcodegen`)
# if the checked-in project ever gives you trouble.
name: Cadence
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  Cadence:
    type: application
    platform: iOS
    sources: [Cadence]
    configFiles:
      Debug: Config/Config.xcconfig
      Release: Config/Config.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Cadence
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_VERSION: 5.0
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
