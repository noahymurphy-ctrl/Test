<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Frame</title>
<meta name="description" content="Put any photo in a clean white frame with its camera data underneath." />
<meta name="theme-color" content="#111113" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Frame" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<style>
  :root { --bg:#111113; --panel:#1c1c1f; --line:#2c2c30; --text:#f2f2f4; --dim:#8e8e96; --accent:#0a84ff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, "SF Pro Text", system-ui, "Helvetica Neue", Arial, sans-serif;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    border-bottom: 1px solid var(--line); flex-wrap: wrap;
  }
  h1 { font-size: 17px; font-weight: 650; margin: 0; margin-right: auto; letter-spacing: .2px; }
  button, .btn {
    appearance: none; border: 0; border-radius: 10px; padding: 9px 14px; font: inherit; font-weight: 600;
    background: var(--panel); color: var(--text); cursor: pointer; border: 1px solid var(--line);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .35; cursor: default; }
  .toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; font-weight: 600; }
  .toggle input { position: absolute; opacity: 0; pointer-events: none; }
  .track { width: 46px; height: 28px; border-radius: 14px; background: #3a3a3f; position: relative; transition: background .15s; }
  .track::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; border-radius: 50%;
    background: #fff; transition: transform .15s; box-shadow: 0 1px 3px rgba(0,0,0,.4);
  }
  .toggle input:checked + .track { background: #30d158; }
  .toggle input:checked + .track::after { transform: translateX(18px); }
  .toggle input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
  main { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 16px; position: relative; }
  canvas#out { max-width: 100%; max-height: 100%; box-shadow: 0 8px 40px rgba(0,0,0,.55); display: none; }
  #empty {
    width: min(560px, 100%); border: 2px dashed #3a3a40; border-radius: 18px; padding: 56px 24px; text-align: center;
    color: var(--dim); cursor: pointer;
  }
  #empty strong { display: block; color: var(--text); font-size: 18px; margin-bottom: 6px; }
  main.drag #empty { border-color: var(--accent); color: var(--text); }
  details { border-top: 1px solid var(--line); padding: 8px 16px; }
  summary { cursor: pointer; color: var(--dim); font-weight: 600; padding: 4px 0; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px 0 6px; }
  .fields input {
    width: 100%; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 10px; font: inherit; font-size: 16px;
  }
  @media (max-width: 520px) { .fields { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Frame</h1>
  <label class="toggle" title="Off: no data, equal margins on every side">
    <input type="checkbox" id="data" checked />
    <span class="track"></span><span>Data</span>
  </label>
  <button id="open">Open</button>
  <button id="share" class="primary" hidden disabled>Share</button>
  <button id="save" class="primary" disabled>Save</button>
</header>

<main id="stage">
  <div id="empty" role="button" tabindex="0">
    <strong>Choose a photo</strong>
    Tap here or drop an image. Camera data is read from the photo’s EXIF.
  </div>
  <canvas id="out"></canvas>
</main>

<details id="edit" hidden>
  <summary>Edit text</summary>
  <div class="fields">
    <input id="f1" placeholder="Settings" aria-label="Settings line" />
    <input id="f3" placeholder="Camera" aria-label="Camera name" />
    <input id="f2" placeholder="Date" aria-label="Date" />
    <input id="f4" placeholder="Lens" aria-label="Lens" />
  </div>
</details>

<input type="file" id="file" accept="image/*" hidden />

<script>
'use strict'
const $ = (id) => document.getElementById(id)
const out = $('out'), stage = $('stage')

// ---- Layout constants, measured from the reference print (all in units `u`, photo width = REF_W u) ----
const REF_W = 1358       // photo width
const MARGIN = 40        // border: top / left / right, and gap above the text
const LINE1_Y = 40       // line 1 centre, below the photo
const LINE2_Y = 76       // line 2 centre, below the photo
const FOOT = 128         // space below the photo when data is shown
const FONT = 22          // text size
const COL2 = 0.6         // right column starts at 60% of the photo width
const MAX_PIXELS = 16e6  // stay under mobile canvas limits

const state = { img: null, name: 'photo', text: { l1: '', l2: '', r1: '', r2: '' } }
const showData = () => $('data').checked

// ---- Minimal EXIF reader (JPEG, HEIC, anything with an "Exif\0\0" TIFF block) ----
function readExif(buf) {
  const u8 = new Uint8Array(buf, 0, Math.min(buf.byteLength, 4 * 1024 * 1024))
  let at = -1
  for (let i = 0; i < u8.length - 8; i++) {
    if (u8[i] === 0x45 && u8[i + 1] === 0x78 && u8[i + 2] === 0x69 && u8[i + 3] === 0x66 && u8[i + 4] === 0 && u8[i + 5] === 0) {
      const a = u8[i + 6], b = u8[i + 7]
      if ((a === 0x49 && b === 0x49) || (a === 0x4d && b === 0x4d)) { at = i + 6; break }
    }
  }
  if (at < 0) return {}
  const dv = new DataView(buf, at)
  const le = dv.getUint16(0) === 0x4949
  const u16 = (o) => dv.getUint16(o, le), u32 = (o) => dv.getUint32(o, le)
  const SZ = { 1: 1, 2: 1, 3: 2, 4: 4, 5: 8, 7: 1, 9: 4, 10: 8 }
  const tags = {}
  function ifd(off, wanted) {
    if (off + 2 > dv.byteLength) return
    const n = u16(off)
    for (let i = 0; i < n; i++) {
      const e = off + 2 + i * 12
      if (e + 12 > dv.byteLength) return
      const tag = u16(e), type = u16(e + 2), cnt = u32(e + 4)
      if (!wanted.includes(tag)) continue
      const size = (SZ[type] || 1) * cnt
      const vo = size <= 4 ? e + 8 : u32(e + 8)
      if (vo + size > dv.byteLength) continue
      let v
      if (type === 2) { v = ''; for (let k = 0; k < cnt; k++) { const c = dv.getUint8(vo + k); if (!c) break; v += String.fromCharCode(c) }; v = v.trim() }
      else if (type === 3) v = u16(vo)
      else if (type === 4) v = u32(vo)
      else if (type === 5) { const d = u32(vo + 4); v = d ? u32(vo) / d : 0 }
      else continue
      tags[tag] = v
    }
  }
  const first = u32(4)
  ifd(first, [0x010f, 0x0110, 0x8769])
  const exifPtr = (() => {
    const n = u16(first)
    for (let i = 0; i < n; i++) { const e = first + 2 + i * 12; if (u16(e) === 0x8769) return u32(e + 8) }
    return 0
  })()
  if (exifPtr) ifd(exifPtr, [0x829a, 0x829d, 0x8827, 0x9003, 0x920a, 0xa405, 0xa434])
  return {
    make: tags[0x010f], model: tags[0x0110], exposure: tags[0x829a], fnumber: tags[0x829d], iso: tags[0x8827],
    date: tags[0x9003], focal: tags[0x920a], focal35: tags[0xa405], lens: tags[0xa434],
  }
}

const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']
function textFromExif(x, file) {
  const bits = []
  if (x.iso) bits.push('ISO ' + x.iso)
  if (x.fnumber) bits.push('ƒ/' + (Math.round(x.fnumber * 10) / 10))
  if (x.exposure) bits.push(x.exposure >= 1 ? Math.round(x.exposure * 10) / 10 + 's' : '1/' + Math.round(1 / x.exposure) + 's')
  const fl = x.focal35 || (x.focal && Math.round(x.focal))
  if (fl) bits.push(fl + 'mm')
  let date = ''
  const m = /^(\d{4}):(\d\d):(\d\d)/.exec(x.date || '')
  if (m) date = `${+m[3]} ${MONTHS[+m[2] - 1]} ${m[1]}`
  else if (file && file.lastModified) { const d = new Date(file.lastModified); date = `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}` }
  return { l1: bits.join(' | '), l2: date, r1: x.model || '', r2: x.lens || '' }
}

// ---- Rendering ----
// `photoW` is the drawn photo width in px; everything else scales from it.
function layout(photoW, withData) {
  const u = photoW / REF_W
  const m = Math.round(MARGIN * u)
  const photoH = Math.round(photoW * state.img.naturalHeight / state.img.naturalWidth)
  const bottom = withData ? Math.round(FOOT * u) : m
  return { u, m, photoW: Math.round(photoW), photoH, W: Math.round(photoW) + 2 * m, H: m + photoH + bottom }
}

function fitText(ctx, str, weight, px, maxW) {
  ctx.font = `${weight} ${px}px -apple-system, "SF Pro Text", system-ui, "Helvetica Neue", Arial, sans-serif`
  const w = ctx.measureText(str).width
  if (w > maxW && maxW > 0) {
    const s = Math.max(maxW / w, 0.4)
    ctx.font = `${weight} ${px * s}px -apple-system, "SF Pro Text", system-ui, "Helvetica Neue", Arial, sans-serif`
  }
}

function render(canvas, photoW, withData) {
  const L = layout(photoW, withData)
  canvas.width = L.W; canvas.height = L.H
  const ctx = canvas.getContext('2d')
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, L.W, L.H)
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high'
  ctx.drawImage(state.img, L.m, L.m, L.photoW, L.photoH)
  if (!withData) return L
  const { u, m } = L, t = state.text
  const y1 = m + L.photoH + LINE1_Y * u, y2 = m + L.photoH + LINE2_Y * u
  const xR = m + COL2 * L.photoW, right = L.W - m, px = FONT * u
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left'
  const draw = (s, x, y, weight, color, maxW) => {
    if (!s) return
    fitText(ctx, s, weight, px, maxW); ctx.fillStyle = color; ctx.fillText(s, x, y)
  }
  draw(t.l1, m, y1, 600, '#1d1d1f', xR - m - 20 * u)
  draw(t.l2, m, y2, 400, '#8e8e93', xR - m - 20 * u)
  draw(t.r1, xR, y1, 600, '#1d1d1f', right - xR)
  draw(t.r2, xR, y2, 400, '#8e8e93', right - xR)
  return L
}

function refresh() {
  if (!state.img) return
  const photoW = Math.min(state.img.naturalWidth, 1600)
  render(out, photoW, showData())
}

// Full-resolution export, capped to MAX_PIXELS total.
function exportBlob(type = 'image/jpeg') {
  const c = document.createElement('canvas')
  let photoW = state.img.naturalWidth
  let L = layout(photoW, showData())
  const px = L.W * L.H
  if (px > MAX_PIXELS) photoW = Math.floor(photoW * Math.sqrt(MAX_PIXELS / px))
  render(c, photoW, showData())
  return new Promise((res) => c.toBlob(res, type, 0.95))
}
const outName = () => state.name.replace(/\.[^.]+$/, '') + '-framed.jpg'

// ---- Loading ----
async function load(file) {
  if (!file) return
  const buf = await file.arrayBuffer()
  let exif = {}
  try { exif = readExif(buf) } catch (e) { /* ignore */ }
  const url = URL.createObjectURL(file)
  const img = new Image()
  img.src = url
  try { await img.decode() } catch (e) { alert('Could not open that image.'); URL.revokeObjectURL(url); return }
  state.img = img; state.name = file.name || 'photo'; state.text = textFromExif(exif, file)
  $('f1').value = state.text.l1; $('f2').value = state.text.l2; $('f3').value = state.text.r1; $('f4').value = state.text.r2
  $('empty').style.display = 'none'; out.style.display = 'block'
  $('edit').hidden = false; $('save').disabled = false; $('share').disabled = false
  refresh()
}

// ---- Wiring ----
const pick = () => $('file').click()
$('open').onclick = pick
$('empty').onclick = pick
$('empty').onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick() } }
$('file').onchange = (e) => { load(e.target.files[0]); e.target.value = '' }
try { $('data').checked = localStorage.getItem('frame.data') !== '0' } catch (e) {}
$('data').onchange = () => { try { localStorage.setItem('frame.data', showData() ? '1' : '0') } catch (e) {} refresh(); $('edit').style.display = showData() ? '' : 'none' }
$('edit').style.display = showData() ? '' : 'none'
for (const [id, k] of [['f1', 'l1'], ['f2', 'l2'], ['f3', 'r1'], ['f4', 'r2']]) $(id).oninput = (e) => { state.text[k] = e.target.value; refresh() }

stage.addEventListener('dragover', (e) => { e.preventDefault(); stage.classList.add('drag') })
stage.addEventListener('dragleave', () => stage.classList.remove('drag'))
stage.addEventListener('drop', (e) => { e.preventDefault(); stage.classList.remove('drag'); load(e.dataTransfer.files[0]) })

$('save').onclick = async () => {
  const blob = await exportBlob()
  const a = document.createElement('a')
  a.href = URL.createObjectURL(blob); a.download = outName(); a.click()
  setTimeout(() => URL.revokeObjectURL(a.href), 5000)
}
const canShareFiles = () => { try { return navigator.canShare && navigator.canShare({ files: [new File([''], 'a.jpg', { type: 'image/jpeg' })] }) } catch (e) { return false } }
if (canShareFiles()) {
  $('share').hidden = false
  $('share').onclick = async () => {
    const blob = await exportBlob()
    try { await navigator.share({ files: [new File([blob], outName(), { type: 'image/jpeg' })] }) } catch (e) { /* cancelled */ }
  }
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {})
</script>
</body>
</html>
